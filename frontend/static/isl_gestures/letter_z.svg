<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg_Z" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.25"/>
    </linearGradient>
    <filter id="shadow_Z" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect x="4" y="4" width="192" height="192" rx="16" fill="url(#bg_Z)" stroke="#6366F1" stroke-width="2"/>
  
  <!-- Category Badge -->
  <rect x="12" y="12" width="75" height="18" rx="9" fill="#4F46E5"/>
  <text x="49" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ALPHABET</text>

  <!-- ISL Badge -->
  <rect x="145" y="12" width="42" height="18" rx="9" fill="#10B981"/>
  <text x="166" y="24" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="9" font-weight="bold" text-anchor="middle">ISL</text>

  <!-- Central Hand Gesture Visualization -->
  <g transform="translate(100, 95)" filter="url(#shadow_Z)">
    <!-- Hand Palm & Wrist -->
    <ellipse cx="0" cy="18" rx="28" ry="32" fill="#FBBF24" stroke="#D97706" stroke-width="2.5"/>
    <rect x="-18" y="40" width="36" height="24" rx="6" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
    
    <!-- Finger Archetype / Representation -->
    <path d="M -20,10 L -24,-20 Q -24,-32 -18,-32 Q -12,-32 -12,-18 L -12,-26 Q -12,-38 -6,-38 Q 0,-38 0,-24 L 0,-28 Q 0,-40 6,-40 Q 12,-40 12,-25 L 12,-22 Q 12,-34 18,-34 Q 24,-34 24,-20 L 22,10 Z" fill="#FDE68A" stroke="#D97706" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Motion Arrow indicator -->
    <path d="M -35,5 Q -45,-15 -25,-25" fill="none" stroke="#6366F1" stroke-width="3" stroke-dasharray="3,3" marker-end="url(#arrow)"/>
    <polygon points="-25,-25 -32,-20 -24,-17" fill="#6366F1"/>
  </g>

  <!-- Term Label -->
  <rect x="10" y="142" width="180" height="46" rx="8" fill="#1E293B" fill-opacity="0.9"/>
  <text x="100" y="162" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" text-anchor="middle">Z</text>
  <text x="100" y="178" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="9" text-anchor="middle">ISL Finger-Spelling for 'Z'</text>
</svg>